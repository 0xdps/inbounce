name: Check

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
  verify-node-builds:
    name: Verify ${{ matrix.name }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            path: services/backend
          - name: frontend
            path: services/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.path }}
        run: npm run build
